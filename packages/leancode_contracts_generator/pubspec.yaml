name: leancode_contracts_generator
repository: https://github.com/leancodepl/contractsgenerator-dart
description: Dart contracts client generator for a CQRS API.
version: 0.18.1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  analyzer: ">=8.1.1 <15.0.0"
  args: ^2.7.0
  build: ^4.0.0
  code_builder: ^4.11.0
  collection: ^1.19.1
  dart_style: ^3.1.1
  fixnum: ^1.1.1
  json_serializable: ^6.11.0
  leancode_contracts: ^0.9.0
  meta: ^1.16.0
  path: ^1.9.1
  protobuf: ^4.2.0
  recase: ^4.1.0
  source_gen: ^4.2.0
  source_helper: ^1.3.0
  yaml: ^3.1.3

dev_dependencies:
  leancode_lint: ^19.0.0
  leancode_pipe: ^2.0.0
  test: ^1.26.3

dependency_overrides:
  leancode_contracts:
    path: ../leancode_contracts

executables:
  leancode_contracts_generator: leancode_contracts_generator
