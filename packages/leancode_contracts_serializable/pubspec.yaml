name: leancode_contracts_serializable
description: >-
  A json_serializable builder extended with support for serializing generic
  contract types (generated by leancode_contracts_generator) as fields, which
  stock json_serializable cannot do.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  analyzer: ">=8.0.0 <14.0.0"
  build: ^4.0.0
  json_serializable: ^6.14.0
  source_gen: ">=3.0.0 <5.0.0"
  source_helper: ^1.3.0
dev_dependencies:
  test: ^1.25.0
